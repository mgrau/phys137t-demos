<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111215" />
    <title>PHYS 137T Interactive Demos</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Inline and before the stylesheet paints, so a stored light preference
      // does not flash dark on load. The same key and attribute the demos use;
      // see the root README.md for the contract.
      try {
        var t = localStorage.getItem('phys137t-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        /* localStorage can throw in private mode; the CSS default covers us. */
      }
    </script>
  </head>
  <body>
    <div class="hub-shell">
      <aside class="sidebar">
        <header class="brand">
          <button id="menu-toggle" type="button" class="icon-btn menu-toggle"
            aria-label="Choose a demo" aria-expanded="false" aria-controls="demo-menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="brand-text">
            <p class="eyebrow">PHYS 137T</p>
            <h1>Interactive demos</h1>
          </div>
          <h1 class="mobile-brand">PHYS137T Interactive Demos</h1>
        </header>
        <div class="demo-menu" id="demo-menu">
          <nav
            class="demo-list"
            id="demo-list"
            aria-label="Available demonstrations"
          ></nav>
          <div class="mobile-actions">
            <button type="button" class="icon-btn theme-toggle"></button>
            <a class="open-demo" href="./interference/" target="_blank" rel="noopener">Open demo <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </aside>
      <button id="menu-backdrop" type="button" class="menu-backdrop" hidden
        tabindex="-1" aria-label="Close demo menu"></button>

      <main class="workspace">
        <header class="workspace-bar">
          <div class="workspace-heading">
            <span class="workspace-kicker" id="active-lecture"></span>
            <h2 id="active-title"></h2>
            <p class="workspace-description" id="active-description"></p>
          </div>
          <div class="workspace-actions">
            <button id="theme-toggle" type="button" class="icon-btn theme-toggle"></button>
            <a id="open-demo" class="open-demo" href="./interference/" target="_blank" rel="noopener">
              Open demo
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </header>
        <div class="demo-frame-wrap">
          <iframe id="demo-frame" title="Interactive demonstration" allow="fullscreen"></iframe>
        </div>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
